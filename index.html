<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Toko Kelontong</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f6f7fb;color:#222}
header{background:#176b45;color:white;padding:18px 22px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
header h1{margin:0;font-size:24px}.wrap{max-width:1100px;margin:auto;padding:18px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
button,.btn{border:0;border-radius:9px;padding:10px 14px;cursor:pointer;font-weight:600;background:#176b45;color:#fff}
button.secondary{background:#e8ecea;color:#18352a}.cat.active{background:#176b45;color:#fff}
.search{width:100%;padding:12px;border:1px solid #ddd;border-radius:10px;margin-bottom:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px}
.card{background:#fff;border-radius:14px;padding:12px;box-shadow:0 2px 10px #00000010}
.card img{width:100%;height:135px;object-fit:cover;border-radius:10px;background:#eee}
.card h3{margin:10px 0 5px;font-size:17px}.muted{color:#6b7280;font-size:13px}.price{font-size:18px;font-weight:700;margin:8px 0}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.row>*{flex:1}.card button{width:100%}
.panel{background:#fff;border-radius:14px;padding:18px;margin-top:14px;box-shadow:0 2px 10px #00000010}
input,select{padding:11px;border:1px solid #ddd;border-radius:9px;width:100%;margin:5px 0 10px}
table{width:100%;border-collapse:collapse}th,td{padding:9px;border-bottom:1px solid #eee;text-align:left}
.hidden{display:none}.total{font-size:22px;font-weight:800}
.badge{display:inline-block;background:#e8f4ee;color:#176b45;padding:5px 8px;border-radius:99px;font-size:12px}
.modal{position:fixed;inset:0;background:#0008;display:flex;align-items:center;justify-content:center;padding:20px}.modal>div{background:#fff;border-radius:15px;padding:20px;width:min(500px,100%)}
</style>
</head>
<body>
<header><h1>🛒 Toko Kelontong</h1><button onclick="show('cart')">🛍️ Keranjang (<span id="cartCount">0</span>)</button></header>
<div class="wrap">
<div class="tabs">
<button class="secondary" onclick="show('products')">Produk</button>
<button class="secondary" onclick="show('manage')">Kelola Produk</button>
<button class="secondary" onclick="show('history')">Riwayat Transaksi</button>
</div>

<section id="products">
<div class="panel">
<h2>Daftar Produk</h2>
<input id="search" class="search" placeholder="🔎 Cari nama produk atau barcode..." oninput="renderProducts()">
<div id="cats" class="tabs"></div>
<div id="productsGrid" class="grid"></div>
</div></section>

<section id="manage" class="hidden">
<div class="panel"><h2>Tambah / Edit Produk</h2>
<input id="pname" placeholder="Nama produk">
<input id="pcat" placeholder="Kategori, misalnya Sembako">
<input id="pprice" type="number" placeholder="Harga">
<input id="pstock" type="number" placeholder="Stok (boleh dikosongkan)">
<input id="pbarcode" placeholder="Barcode (boleh dikosongkan)">
<input id="pimg" type="file" accept="image/*">
<div class="row"><button onclick="saveProduct()">Simpan Produk</button><button class="secondary" onclick="clearForm()">Batal</button></div>
</div>
<div class="panel"><h2>Produk Tersimpan</h2><div id="manageList"></div>
<hr><h3>Kategori</h3><div class="row"><input id="newcat" placeholder="Nama kategori baru"><button onclick="addCategory()">Tambah Kategori</button></div><div id="catList"></div></div>
</section>

<section id="cart" class="hidden"><div class="panel">
<h2>Keranjang</h2><div id="cartList"></div><hr>
<div class="row"><div class="total">Total: Rp <span id="cartTotal">0</span></div><input id="payment" type="number" placeholder="Uang dibayar"></div>
<p>Kembalian: <b>Rp <span id="change">0</span></b></p>
<button onclick="checkout()">Bayar & Simpan Transaksi</button>
</div></section>

<section id="history" class="hidden"><div class="panel"><h2>Riwayat Transaksi</h2><div id="historyList"></div></div></section>
</div>

<div id="modal" class="modal hidden"><div>
<h2>📷 Scan Barcode</h2><p class="muted">Fitur kamera membutuhkan izin kamera dari browser.</p>
<video id="video" autoplay playsinline style="width:100%;border-radius:10px;background:#111"></video>
<button onclick="closeScanner()">Tutup</button>
</div></div>

<script>
const defaultProducts=[
{id:1,name:'Beras 5 kg',cat:'Sembako',price:75000,stock:'',barcode:'899000000001',img:''},
{id:2,name:'Minyak Goreng 1 L',cat:'Sembako',price:18000,stock:'',barcode:'899000000002',img:''},
{id:3,name:'Gula Pasir 1 kg',cat:'Sembako',price:17000,stock:'',barcode:'899000000003',img:''},
{id:4,name:'Teh Celup',cat:'Minuman',price:8000,stock:'',barcode:'899000000004',img:''},
{id:5,name:'Kopi Sachet',cat:'Minuman',price:2000,stock:'',barcode:'899000000005',img:''},
{id:6,name:'Mie Instan',cat:'Makanan',price:3500,stock:'',barcode:'899000000006',img:''}
];
let products=JSON.parse(localStorage.getItem('tk_products')||'null')||defaultProducts;
let categories=JSON.parse(localStorage.getItem('tk_cats')||'null')||['Sembako','Minuman','Makanan','Lainnya'];
let cart=JSON.parse(localStorage.getItem('tk_cart')||'[]');
let history=JSON.parse(localStorage.getItem('tk_history')||'[]');
let editId=null,currentCat='Semua';

function rupiah(n){return Number(n||0).toLocaleString('id-ID')}
function persist(){localStorage.setItem('tk_products',JSON.stringify(products));localStorage.setItem('tk_cats',JSON.stringify(categories));localStorage.setItem('tk_cart',JSON.stringify(cart));localStorage.setItem('tk_history',JSON.stringify(history))}
function show(id){['products','manage','cart','history'].forEach(x=>document.getElementById(x).classList.toggle('hidden',x!==id));if(id==='products')renderProducts();if(id==='manage')renderManage();if(id==='cart')renderCart();if(id==='history')renderHistory()}
function renderCats(){document.getElementById('cats').innerHTML=['Semua',...categories].map(c=>`<button class="cat ${currentCat===c?'active':''}" onclick="currentCat=${JSON.stringify(c)};renderProducts()">${c}</button>`).join('')}
function renderProducts(){renderCats();let q=document.getElementById('search').value.toLowerCase();let arr=products.filter(p=>(currentCat==='Semua'||p.cat===currentCat)&&((p.name||'').toLowerCase().includes(q)||(p.barcode||'').includes(q)));document.getElementById('productsGrid').innerHTML=arr.length?arr.map(p=>`<div class="card"><img src="${p.img||'data:image/svg+xml;charset=UTF-8,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="400" height="250"><rect width="100%" height="100%" fill="#e8ecea"/><text x="50%" y="50%" dominant-baseline="middle" text-anchor="middle" fill="#6b7280" font-size="24">Foto Produk</text></svg>')}"><span class="badge">${p.cat}</span><h3>${p.name}</h3><div class="price">Rp ${rupiah(p.price)}</div><div class="muted">Barcode: ${p.barcode||'-'}</div><button onclick="addCart(${p.id})">Tambah ke Keranjang</button></div>`).join(''):'<p>Produk tidak ditemukan.</p>'}
function addCart(id){let p=products.find(x=>x.id===id);let c=cart.find(x=>x.id===id);if(c)c.qty++;else cart.push({id,qty:1});persist();renderCart();updateCount();alert(p.name+' ditambahkan ke keranjang')}
function renderCart(){let total=0;document.getElementById('cartList').innerHTML=cart.length?cart.map(c=>{let p=products.find(x=>x.id===c.id);let sub=p.price*c.qty;total+=sub;return `<div class="row"><div><b>${p.name}</b><br>Rp ${rupiah(p.price)} × ${c.qty}</div><button class="secondary" onclick="changeQty(${p.id},-1)">−</button><button onclick="changeQty(${p.id},1)">+</button><b>Rp ${rupiah(sub)}</b></div><hr>`}).join(''):'<p>Keranjang masih kosong.</p>';document.getElementById('cartTotal').textContent=rupiah(total);calcChange()}
function changeQty(id,d){let c=cart.find(x=>x.id===id);if(!c)return;c.qty+=d;if(c.qty<=0)cart=cart.filter(x=>x.id!==id);persist();renderCart();updateCount()}
function calcChange(){let t=cart.reduce((s,c)=>s+(products.find(p=>p.id===c.id)?.price||0)*c.qty,0);let pay=Number(document.getElementById('payment').value||0);document.getElementById('change').textContent=rupiah(Math.max(0,pay-t))}
document.getElementById('payment').addEventListener('input',calcChange)
function checkout(){let total=cart.reduce((s,c)=>s+(products.find(p=>p.id===c.id)?.price||0)*c.qty,0),pay=Number(document.getElementById('payment').value||0);if(!cart.length)return alert('Keranjang kosong');if(pay<total)return alert('Uang pembayaran belum cukup');history.unshift({date:new Date().toLocaleString('id-ID'),items:cart.map(c=>({...c})),total,pay,change:pay-total});cart=[];persist();document.getElementById('payment').value='';renderCart();renderHistory();updateCount();alert('Transaksi berhasil disimpan')}
function renderHistory(){document.getElementById('historyList').innerHTML=history.length?history.map(h=>`<div class="card"><b>${h.date}</b><p>Total: Rp ${rupiah(h.total)}<br>Dibayar: Rp ${rupiah(h.pay)}<br>Kembalian: Rp ${rupiah(h.change)}</p></div>`).join(''):'<p>Belum ada transaksi.</p>'}
function clearForm(){editId=null;['pname','pcat','pprice','pstock','pbarcode'].forEach(x=>document.getElementById(x).value='');document.getElementById('pimg').value=''}
function saveProduct(){let name=pname.value.trim(),cat=pcat.value.trim()||'Lainnya',price=Number(pprice.value||0);if(!name||!price)return alert('Nama dan harga wajib diisi');let finish=(img)=>{let obj={id:editId||Date.now(),name,cat,price,stock:pstock.value,barcode:pbarcode.value.trim(),img:img||''};if(editId){let i=products.findIndex(p=>p.id===editId);products[i]=obj}else products.push(obj);if(!categories.includes(cat))categories.push(cat);persist();clearForm();renderProducts();renderManage();alert('Produk tersimpan')};let f=pimg.files[0];if(f){let r=new FileReader();r.onload=()=>finish(r.result);r.readAsDataURL(f)}else{let old=editId?products.find(p=>p.id===editId)?.img:'';finish(old)}}
function editProduct(id){let p=products.find(x=>x.id===id);editId=id;pname.value=p.name;pcat.value=p.cat;pprice.value=p.price;pstock.value=p.stock||'';pbarcode.value=p.barcode||'';window.scrollTo(0,0)}
function deleteProduct(id){if(confirm('Hapus produk ini?')){products=products.filter(p=>p.id!==id);persist();renderManage();renderProducts()}}
function renderManage(){document.getElementById('manageList').innerHTML=products.map(p=>`<div class="row"><div><b>${p.name}</b><br><span class="muted">${p.cat} · Rp ${rupiah(p.price)} · barcode ${p.barcode||'-'}</span></div><button onclick="editProduct(${p.id})">Edit</button><button class="secondary" onclick="deleteProduct(${p.id})">Hapus</button></div><hr>`).join('');document.getElementById('catList').innerHTML=categories.map(c=>`<span class="badge" style="margin:4px">${c}</span>`).join('')}
function addCategory(){let c=newcat.value.trim();if(c&&!categories.includes(c)){categories.push(c);persist();newcat.value='';renderManage();renderCats()}}
function updateCount(){cartCount.textContent=cart.reduce((s,c)=>s+c.qty,0)}
renderProducts();renderManage();renderCart();renderHistory();updateCount();
</script>
</body></html>
